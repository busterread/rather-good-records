<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rather Good Records</title>
<meta name="description" content="Independent record label based in London.">

<meta property="og:title" content="Rather Good Records">
<meta property="og:description" content="Independent record label based in London.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rathergoodrecords.com">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --ink:    #10323c;
    --paper:  #f4e9d6;
    --amber:  #f0a830;
    --quiet:  rgba(244, 233, 214, 0.62);
    --rule:   rgba(244, 233, 214, 0.22);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    min-height: 100%;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 2rem 1.5rem 2.5rem;
    max-width: 1100px;
  }

  .wordmark {
    margin: 0 0 auto;
    padding-top: 4rem;
    font-size: clamp(3.4rem, 15.5vw, 11rem);
    font-weight: 700;
    line-height: 0.84;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }

  .wordmark span {
    display: block;
  }

  .wordmark span:last-child {
    color: var(--amber);
  }

  .info {
    margin-top: 4rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    display: grid;
    gap: 2rem;
  }

  @media (min-width: 40rem) {
    .page { padding: 3rem 3rem 3.5rem; }
    .info {
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 3rem;
    }
  }

  .blurb {
    margin: 0;
    max-width: 34ch;
    font-size: 1.0625rem;
    line-height: 1.5;
  }

  .release {
    margin: 0.75rem 0 0;
    max-width: 34ch;
    font-size: 1.0625rem;
    line-height: 1.5;
    color: var(--quiet);
  }

  .release em {
    font-style: italic;
    color: var(--paper);
  }

  .contact {
    margin: 0;
    font-size: 1.0625rem;
    line-height: 1.5;
  }

  a {
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px solid rgba(240, 168, 48, 0.4);
    padding-bottom: 1px;
    transition: border-color 0.15s ease;
  }

  a:hover { border-bottom-color: var(--amber); }

  a:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 3px;
    border-radius: 2px;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.6em); }
    to   { opacity: 1; transform: none; }
  }

  .wordmark span,
  .info {
    animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
  }

  .wordmark span:nth-child(1) { animation-delay: 0.05s; }
  .wordmark span:nth-child(2) { animation-delay: 0.14s; }
  .wordmark span:nth-child(3) { animation-delay: 0.23s; }
  .info                        { animation-delay: 0.4s; }

  @media (prefers-reduced-motion: reduce) {
    .wordmark span, .info { animation: none; }
    a { transition: none; }
  }
</style>
</head>
<body>

  <main class="page">

    <h1 class="wordmark">
      <span>Rather</span>
      <span>Good</span>
      <span>Records</span>
    </h1>

    <div class="info">
      <div>
        <p class="blurb">Independent record label based in London.</p>
        <p class="release">First release: Buster &amp; Tallulah, <em>Little Lady</em>, 2 October 2026.</p>
      </div>
      <p class="contact">
        <a href="mailto:hello@rathergoodrecords.com">hello@rathergoodrecords.com</a>
      </p>
    </div>

  </main>

</body>
</html>
