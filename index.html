<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rather Good Records</title>
<meta name="description" content="Independent record label based in London.">

<meta property="og:title" content="Rather Good Records">
<meta property="og:description" content="Independent record label based in London.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rathergoodrecords.com">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --ink:    #10323c;
    --paper:  #f4e9d6;
    --amber:  #f0a830;
    --quiet:  rgba(244, 233, 214, 0.62);
    --rule:   rgba(244, 233, 214, 0.22);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    min-height: 100%;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 2rem 1.5rem 2.5rem;
    max-width: 1100px;
  }

  .wordmark {
    margin: 0;
    padding-top: 3rem;
    font-size: clamp(3.4rem, 15.5vw, 11rem);
    font-weight: 700;
    line-height: 0.84;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }

  .wordmark span {
    display: block;
  }

  .wordmark span:last-child {
    color: var(--amber);
  }

  .shelving {
    margin: auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
  }

  .shelf-unit {
    position: relative;
    width: min(100%, 14rem);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .shelf {
    position: relative;
    width: 100%;
    height: 16px;
    border-radius: 1px;
    background:
      radial-gradient(11px 5px at 22% 35%, rgba(0, 0, 0, 0.3), transparent 70%),
      radial-gradient(7px 4px at 68% 65%, rgba(0, 0, 0, 0.22), transparent 70%),
      repeating-linear-gradient(88deg,
        rgba(0, 0, 0, 0.15) 0px, rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 5px,
        rgba(0, 0, 0, 0.08) 5px, rgba(0, 0, 0, 0.08) 6px, transparent 6px, transparent 13px,
        rgba(0, 0, 0, 0.1) 13px, rgba(0, 0, 0, 0.1) 14px, transparent 14px, transparent 24px,
        rgba(255, 255, 255, 0.035) 24px, rgba(255, 255, 255, 0.035) 25px, transparent 25px, transparent 37px),
      linear-gradient(100deg, #4d3520 0%, #5c4028 18%, #45301c 42%, #543a22 60%, #3a2814 80%, #2a1a0e 100%),
      linear-gradient(180deg, #5c4028 0%, #46301d 40%, #382413 70%, #2a1a0e 100%);
    box-shadow: 0 8px 14px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 220, 180, 0.12), inset 0 -3px 4px rgba(0, 0, 0, 0.4);
  }

  .record {
    position: relative;
    z-index: 1;
    width: 76px;
    aspect-ratio: 1;
    margin-bottom: -3px;
    padding: 0.45rem 0.4rem;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    border-radius: 3px;
    background: linear-gradient(160deg, rgba(244, 233, 214, 0.14), rgba(244, 233, 214, 0.04));
    border: 1px solid rgba(244, 233, 214, 0.22);
    box-shadow: 0 14px 20px rgba(0, 0, 0, 0.45);
    transform: rotate(-3deg);
    transform-origin: bottom center;
    text-decoration: none;
    border-bottom: 1px solid rgba(244, 233, 214, 0.22);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .record::before {
    content: "";
    position: absolute;
    top: -11px;
    left: 50%;
    transform: translateX(-50%);
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 4px),
      radial-gradient(circle at center, #2c2c2c 0 13px, #131313 13px 100%);
    box-shadow: 0 8px 12px rgba(0, 0, 0, 0.5);
    z-index: -1;
  }

  .record::after {
    content: "";
    position: absolute;
    top: 20px;
    left: 50%;
    width: 26px;
    height: 26px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background-image: url("assets/little-lady-cover-art.jpg");
    background-size: cover;
    background-position: center;
    opacity: 0.7;
    z-index: -1;
  }

  .record:hover,
  .record:focus-visible {
    transform: rotate(-3deg) translateY(-5px);
    box-shadow: 0 20px 24px rgba(0, 0, 0, 0.5);
    border-bottom-color: var(--amber);
  }

  .record:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 3px;
  }

  .record-title {
    font-weight: 700;
    font-size: 0.68rem;
    line-height: 1.15;
    color: var(--paper);
  }

  .record-artist {
    font-size: 0.56rem;
    line-height: 1.25;
    color: var(--quiet);
    margin-top: 0.15rem;
  }

  .record-date {
    font-size: 0.5rem;
    line-height: 1.25;
    color: var(--amber);
    margin-top: 0.25rem;
    letter-spacing: 0.02em;
  }

  .info {
    margin-top: 4rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    display: grid;
    gap: 2rem;
  }

  @media (min-width: 40rem) {
    .page { padding: 3rem 3rem 3.5rem; }
    .info {
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 3rem;
    }
  }

  .blurb {
    margin: 0;
    max-width: 34ch;
    font-size: 1.0625rem;
    line-height: 1.5;
  }

  a {
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px solid rgba(240, 168, 48, 0.4);
    padding-bottom: 1px;
    transition: border-color 0.15s ease;
  }

  a:hover { border-bottom-color: var(--amber); }

  a:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 3px;
    border-radius: 2px;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.6em); }
    to   { opacity: 1; transform: none; }
  }

  .wordmark span,
  .info {
    animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
  }

  .wordmark span:nth-child(1) { animation-delay: 0.05s; }
  .wordmark span:nth-child(2) { animation-delay: 0.14s; }
  .wordmark span:nth-child(3) { animation-delay: 0.23s; }
  .info                        { animation-delay: 0.4s; }

  @media (prefers-reduced-motion: reduce) {
    .wordmark span, .info { animation: none; }
    a, .record { transition: none; }
  }
</style>
</head>
<body>

  <main class="page">

    <h1 class="wordmark">
      <span>Rather</span>
      <span>Good</span>
      <span>Records</span>
    </h1>

    <section class="shelving" aria-label="Record display shelves">
      <div class="shelf-unit">
        <a class="record" href="https://busterandtallulah.com" target="_blank" rel="noopener">
          <span class="record-title">Little Lady</span>
          <span class="record-artist">Buster &amp; Tallulah</span>
          <span class="record-date">Out 2 October 2026</span>
        </a>
        <div class="shelf"></div>
      </div>
      <div class="shelf-unit">
        <div class="shelf"></div>
      </div>
    </section>

    <div class="info">
      <p class="blurb">Independent record label based in London.</p>
    </div>

  </main>

</body>
</html>
